name: verified-recap
# The morning after a show, posts exact song lengths from phish.in's recording.
# Exits quietly if there was no show or the recording isn't up yet.
# Runs on the self-hosted WINDOWS runner — steps are PowerShell.

on:
  schedule:
    - cron: '0 15 * * *'   # 11am ET
  workflow_dispatch:
    inputs:
      date:
        description: "Show date (YYYY-MM-DD); default = yesterday"
        required: false

concurrency:
  group: show-night   # share the state cache safely with the night job
  cancel-in-progress: false

jobs:
  recap:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -r requirements.txt

      - name: Ensure persistent state dir
        run: New-Item -ItemType Directory -Force -Path C:\bot-state | Out-Null

      - name: Post verified lengths
        env:
          TRUTH_BEARER_TOKEN: ${{ secrets.TRUTH_BEARER_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          # The verified phish.in thread is the trustworthy one (live lengths
          # are estimates), so it goes to X unlike the "lengths" kind.
          # phishpicks is deliberately NOT here: this path posts thread text
          # with no song/set meta, which that publisher would only no-op on.
          PLATFORMS: truthsocial,x
          STATE_DB: C:\bot-state\botstate.db
          PYTHONUTF8: "1"   # unicode song titles/emoji safe on Windows console
        run: |
          $d = "${{ github.event.inputs.date }}"
          if (-not $d) { $d = (Get-Date).AddDays(-1).ToString("yyyy-MM-dd") }
          .venv\Scripts\python main.py verified-recap --date $d
